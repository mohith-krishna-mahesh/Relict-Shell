<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100C08" />
    <meta name="description" content="Relict plans complete, confidence-aware genome engineering strategies and therapeutic interventions." />
    <link rel="icon" type="image/svg+xml" href="/logo/relict-logomark.svg" />
    <title>Relict — Frontier AI for Interventions & Computational Biology</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('relict_theme');
          var theme = 'dark';
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else if (saved === 'system' || !saved) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
